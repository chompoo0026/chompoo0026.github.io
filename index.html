<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบติดตามข้อมูลผู้ป่วย 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FDF6F0;
    --card: #FFFFFF;
    --pink: #F6A6B2;
    --pink-dark: #E8899A;
    --mint: #A6D8D4;
    --mint-dark: #7EC0BB;
    --lavender: #B9A6E0;
    --lavender-dark: #9C84CE;
    --text: #4A4458;
    --text-soft: #8B839A;
    --warn: #FF9B6A;
    --danger: #E85D5D;
    --line: #F0E4E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Sarabun', sans-serif;
    background:
      radial-gradient(circle at 8% 8%, rgba(246,166,178,0.18), transparent 40%),
      radial-gradient(circle at 95% 12%, rgba(166,216,212,0.22), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(185,166,224,0.16), transparent 40%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{font-family:'Prompt', sans-serif;}
  .wrap{max-width:1100px; margin:0 auto; padding:20px 16px 60px;}

  /* header */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 22px; background:linear-gradient(120deg, var(--pink), var(--lavender));
    border-radius:24px; color:white; box-shadow:0 10px 30px -12px rgba(185,166,224,0.55);
    margin-bottom:22px; flex-wrap:wrap;
  }
  header.top .brand{display:flex; align-items:center; gap:12px;}
  header.top .brand .blob{
    width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center; font-size:26px;
    border:2px solid rgba(255,255,255,0.5);
  }
  header.top h1{margin:0; font-size:20px; font-weight:600;}
  header.top p{margin:2px 0 0; font-size:13px; opacity:0.92;}
  #clockNow{font-size:12px; background:rgba(255,255,255,0.22); padding:6px 12px; border-radius:999px;}

  /* nav */
  nav.tabs{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;
  }
  nav.tabs button{
    border:none; cursor:pointer; padding:11px 18px; border-radius:16px;
    background:white; color:var(--text); font-family:'Prompt',sans-serif; font-weight:500; font-size:14px;
    box-shadow:0 4px 14px -8px rgba(74,68,88,0.25); transition:transform .15s ease, background .15s ease, color .15s ease;
    display:flex; align-items:center; gap:8px;
  }
  nav.tabs button:hover{transform:translateY(-2px);}
  nav.tabs button.active{
    background:linear-gradient(120deg, var(--pink-dark), var(--lavender-dark)); color:white;
  }
  nav.tabs button .count{
    background:rgba(0,0,0,0.08); border-radius:999px; padding:1px 8px; font-size:11px;
  }
  nav.tabs button.active .count{background:rgba(255,255,255,0.28);}

  .card{
    background:var(--card); border-radius:22px; padding:22px; margin-bottom:18px;
    box-shadow:0 8px 26px -18px rgba(74,68,88,0.35); border:1px solid var(--line);
  }
  .card h2{margin:0 0 4px; font-size:18px; display:flex; align-items:center; gap:8px;}
  .subnote{color:var(--text-soft); font-size:13px; margin:0 0 16px;}

  /* form */
  label{font-size:13px; font-weight:600; color:var(--text-soft); display:block; margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line);
    font-family:'Sarabun',sans-serif; font-size:14px; color:var(--text); background:#FFFCFB;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--pink);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#FFFCFB; padding:8px 14px; border-radius:999px;
    cursor:pointer; font-size:13px; color:var(--text); transition:all .15s ease; user-select:none;
  }
  .chip:hover{border-color:var(--pink);}
  .chip.selected{background:linear-gradient(120deg, var(--pink), var(--lavender)); color:white; border-color:transparent; font-weight:600;}

  .btn{
    border:none; cursor:pointer; padding:12px 22px; border-radius:14px; font-family:'Prompt',sans-serif;
    font-weight:600; font-size:14px; background:linear-gradient(120deg, var(--pink-dark), var(--lavender-dark));
    color:white; box-shadow:0 6px 18px -8px rgba(232,137,154,0.6);
  }
  .btn.secondary{background:#F3EEF7; color:var(--text); box-shadow:none;}
  .btn.small{padding:7px 14px; font-size:13px; border-radius:10px;}
  .btn.ghost{background:transparent; color:var(--pink-dark); box-shadow:none; border:1.5px solid var(--pink);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--text-soft); font-weight:600; padding:10px 8px; border-bottom:2px solid var(--line); white-space:nowrap;}
  td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr.expiring{background:#FFF3EC;}
  tr.expired{background:#FDE7E7;}
  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .badge.ok{background:#E4F6F1; color:#2E9E7F;}
  .badge.warn{background:#FFE9D9; color:#C4682B;}
  .badge.danger{background:#FBDCDC; color:#C23A3A;}
  .badge.info{background:#EFE7FB; color:#7857BF;}

  .empty{text-align:center; color:var(--text-soft); padding:30px 10px; font-size:14px;}
  .empty .em{font-size:34px; display:block; margin-bottom:8px;}

  /* calendar */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head .title{font-family:'Prompt',sans-serif; font-weight:600; font-size:17px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:12px; color:var(--text-soft); font-weight:600; padding-bottom:4px;}
  .cal-cell{
    min-height:78px; border-radius:12px; border:1.5px solid var(--line); padding:6px; cursor:pointer;
    background:#FFFCFB; transition:border-color .15s ease; position:relative;
  }
  .cal-cell:hover{border-color:var(--pink);}
  .cal-cell.today{border-color:var(--mint-dark); background:#F1FBFA;}
  .cal-cell.other-month{opacity:.35;}
  .cal-cell .dnum{font-size:12px; font-weight:600;}
  .cal-cell .evt{
    font-size:10.5px; background:var(--lavender); color:white; border-radius:6px; padding:1px 5px;
    margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cal-cell .evt.expiry{background:var(--warn);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,68,88,0.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal{
    background:white; border-radius:20px; padding:24px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px -20px rgba(0,0,0,0.4);
  }
  .modal h3{margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .modal .close-row{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .appt-item{
    display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:10px;
    background:#F8F5FB; margin-bottom:6px; font-size:13px;
  }
  .appt-item .del{color:var(--danger); cursor:pointer; font-size:12px; font-weight:600;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:white;
    padding:12px 22px; border-radius:14px; font-size:14px; z-index:100; box-shadow:0 10px 30px -10px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px;
  }

  .drug-btn-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:700px){.drug-btn-grid{grid-template-columns:repeat(2,1fr);}}
  .drug-btn{
    border:1.5px solid var(--line); background:#FFFCFB; border-radius:16px; padding:14px 10px; cursor:pointer;
    text-align:center; font-family:'Prompt',sans-serif; font-weight:600; font-size:13px; color:var(--text);
    transition:all .15s ease;
  }
  .drug-btn:hover{border-color:var(--mint-dark); transform:translateY(-2px);}
  .drug-btn .n{display:block; font-size:20px; margin-bottom:4px;}
  .drug-btn .cnt{display:block; font-size:11px; color:var(--text-soft); margin-top:3px; font-weight:400;}

  .settings-list{display:flex; flex-direction:column; gap:8px;}
  .settings-item{display:flex; justify-content:space-between; align-items:center; background:#F8F5FB; border-radius:12px; padding:10px 14px; font-size:13.5px;}

  .footnote{font-size:12px; color:var(--text-soft); text-align:center; margin-top:30px; line-height:1.7;}
  .flower{position:absolute; font-size:14px; opacity:0.5;}
  .search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .search-row input{flex:1; min-width:180px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="blob">🌷</div>
      <div>
        <h1>ระบบติดตามข้อมูลผู้ป่วยมะเร็งนรีเวช</h1>
        <p>บันทึกยา • เอกสารสิทธิ • นัดหมาย • แจ้งเตือนล่วงหน้า 🩺</p>
      </div>
    </div>
    <div id="clockNow"></div>
  </header>

  <nav class="tabs" id="tabNav"></nav>

  <div id="content"></div>

  <p class="footnote">🌸 ข้อมูลถูกบันทึกแบบใช้ร่วมกัน (shared) — ทุกคนที่เปิดลิงก์นี้จะเห็นและแก้ไขข้อมูลเดียวกัน โปรดใช้ด้วยความระมัดระวังเรื่องความเป็นส่วนตัวของผู้ป่วย 🔒</p>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ CONSTANTS ============ */
const DISEASES = ['CA ovary','CA Endometrium','CA Cervix','CA Vulva','GTN','CA Vagina','อื่นๆ'];
const RIGHTS = ['สิทธิบัตรทอง (UC)','ประกันสังคม','ข้าราชการ/รัฐวิสาหกิจ','ชำระเงินเอง','อื่นๆ'];
const DRUGS = [
  {key:'Olaparib', emoji:'💊', max:18},
  {key:'Pembrolizumab', emoji:'🎗️', max:35},
  {key:'Etoposide', emoji:'🧪', max:null},
  {key:'Lenvalizumab', emoji:'🌿', max:null},
  {key:'Niraparib', emoji:'✨', max:null},
  {key:'Bevacizumab', emoji:'🩸', max:null},
  {key:'อื่นๆ', emoji:'📝', max:null},
];
const BEVA_TYPES = ['ED จ.2','OCPA'];
const EXPIRY_WARN_DAYS = 30;

let DB = { patients: [], appointments: [], customFields: [] };
let currentTab = 'dashboard';
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let formSelected = { disease:'', drug:'', rights:'', bevaType:'' };

/* ============ STORAGE HELPERS ============ */
async function loadDB(){
  try{
    const p = await window.storage.get('patients', true);
    DB.patients = p ? JSON.parse(p.value) : [];
  }catch(e){ DB.patients = []; }
  try{
    const a = await window.storage.get('appointments', true);
    DB.appointments = a ? JSON.parse(a.value) : [];
  }catch(e){ DB.appointments = []; }
  try{
    const c = await window.storage.get('customFields', true);
    DB.customFields = c ? JSON.parse(c.value) : [];
  }catch(e){ DB.customFields = []; }
}
async function savePatients(){
  await window.storage.set('patients', JSON.stringify(DB.patients), true);
}
async function saveAppointments(){
  await window.storage.set('appointments', JSON.stringify(DB.appointments), true);
}
async function saveCustomFields(){
  await window.storage.set('customFields', JSON.stringify(DB.customFields), true);
}

function toast(msg, emoji='✅'){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${emoji} ${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 2600);
}

function uid(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function daysBetween(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr);
  const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear()+543}`;
}
function expiryStatus(dateStr){
  if(!dateStr) return {cls:'', badge:''};
  const diff = daysBetween(dateStr);
  if(diff < 0) return {cls:'expired', badge:'<span class="badge danger">⛔ หมดอายุแล้ว</span>'};
  if(diff <= EXPIRY_WARN_DAYS) return {cls:'expiring', badge:`<span class="badge warn">⏰ ใกล้หมดอายุ (อีก ${diff} วัน)</span>`};
  return {cls:'', badge:`<span class="badge ok">ปกติ</span>`};
}

/* ============ NAV ============ */
const TABS = [
  {key:'dashboard', label:'หน้าหลัก', emoji:'🏠'},
  {key:'form', label:'บันทึกข้อมูลผู้ป่วย', emoji:'📝'},
  {key:'bydrug', label:'ข้อมูลตามยา', emoji:'💊'},
  {key:'calendar', label:'ปฏิทินนัดหมาย', emoji:'📅'},
  {key:'expiry', label:'แจ้งเตือนหมดอายุ', emoji:'🔔'},
  {key:'settings', label:'ตั้งค่าระบบ', emoji:'⚙️'},
];

function renderNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t=>{
    let count = '';
    if(t.key==='expiry'){
      const n = DB.patients.filter(p=>p.docExpireDate && daysBetween(p.docExpireDate) <= EXPIRY_WARN_DAYS).length;
      if(n>0) count = `<span class="count">${n}</span>`;
    }
    return `<button class="${currentTab===t.key?'active':''}" onclick="switchTab('${t.key}')">${t.emoji} ${t.label} ${count}</button>`;
  }).join('');
}
function switchTab(key){
  currentTab = key;
  renderNav();
  renderContent();
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const total = DB.patients.length;
  const expiringSoon = DB.patients.filter(p=>p.docExpireDate && daysBetween(p.docExpireDate)>=0 && daysBetween(p.docExpireDate)<=EXPIRY_WARN_DAYS).length;
  const expired = DB.patients.filter(p=>p.docExpireDate && daysBetween(p.docExpireDate)<0).length;
  const upcomingAppts = DB.appointments.filter(a=> new Date(a.date) >= new Date(new Date().toDateString())).sort((a,b)=> new Date(a.date)-new Date(b.date)).slice(0,5);

  let html = `
  <div class="grid3">
    <div class="card" style="text-align:center;">
      <div style="font-size:30px;">👩‍⚕️</div>
      <h2 style="justify-content:center;">${total}</h2>
      <p class="subnote">ผู้ป่วยทั้งหมดในระบบ</p>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:30px;">⏰</div>
      <h2 style="justify-content:center; color:var(--warn);">${expiringSoon}</h2>
      <p class="subnote">เอกสารใกล้หมดอายุ (≤30 วัน)</p>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:30px;">⛔</div>
      <h2 style="justify-content:center; color:var(--danger);">${expired}</h2>
      <p class="subnote">เอกสารหมดอายุแล้ว</p>
    </div>
  </div>

  <div class="card">
    <h2>🎉 ความคืบหน้าการให้ยาที่ครบเกณฑ์ / ใกล้ครบ</h2>
    <p class="subnote">Olaparib ครบ 18 ครั้ง • Pembrolizumab ครบ 35 ครั้ง</p>
    ${renderDoseAlerts()}
  </div>

  <div class="card">
    <h2>📅 นัดหมายที่ใกล้ถึง</h2>
    ${upcomingAppts.length ? `<table><thead><tr><th>วันที่</th><th>ผู้ป่วย</th><th>รายละเอียด</th></tr></thead><tbody>
      ${upcomingAppts.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${a.patientName}</td><td>${a.note||'-'}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty"><span class="em">🗓️</span>ยังไม่มีนัดหมายที่ใกล้ถึง</div>`}
  </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function renderDoseAlerts(){
  const targets = DB.patients.filter(p => (p.drug==='Olaparib' || p.drug==='Pembrolizumab') && p.doseCount);
  if(!targets.length) return `<div class="empty"><span class="em">💊</span>ยังไม่มีข้อมูลจำนวนครั้งที่ได้รับยา</div>`;
  return `<table><thead><tr><th>ผู้ป่วย</th><th>HN</th><th>ยา</th><th>ครั้งที่ได้รับ</th><th>สถานะ</th></tr></thead><tbody>
    ${targets.map(p=>{
      const drugInfo = DRUGS.find(d=>d.key===p.drug);
      const max = drugInfo.max;
      let status = `<span class="badge info">กำลังรักษา (${p.doseCount}/${max})</span>`;
      if(p.doseCount >= max) status = `<span class="badge ok">🎉 ครบ ${max} ครั้งแล้ว</span>`;
      else if(p.doseCount >= max-2) status = `<span class="badge warn">⏰ ใกล้ครบ (เหลือ ${max-p.doseCount} ครั้ง)</span>`;
      return `<tr><td>${p.name}</td><td>${p.hn}</td><td>${p.drug}</td><td>${p.doseCount}/${max}</td><td>${status}</td></tr>`;
    }).join('')}
  </tbody></table>`;
}

/* ============ FORM ============ */
function renderForm(editId){
  const editing = editId ? DB.patients.find(p=>p.id===editId) : null;
  if(editing){
    formSelected = { disease: editing.disease, drug: editing.drug, rights: editing.rights, bevaType: editing.bevaType||'' };
  } else if(!editId){
    // keep formSelected as-is only if we're freshly entering tab; reset on explicit new
  }

  const customFieldsHtml = DB.customFields.map(cf => `
    <div class="field">
      <label>${cf.label}</label>
      <input type="text" id="cf_${cf.id}" value="${editing && editing.customFields && editing.customFields[cf.id] ? editing.customFields[cf.id] : ''}">
    </div>
  `).join('');

  document.getElementById('content').innerHTML = `
  <div class="card">
    <h2>📝 ${editing ? 'แก้ไขข้อมูลผู้ป่วย' : 'บันทึกข้อมูลผู้ป่วยใหม่'}</h2>
    <p class="subnote">กรอกข้อมูลผู้ป่วยให้ครบถ้วน แล้วกด "บันทึกข้อมูล" ด้านล่างค่ะ</p>

    <div class="grid2">
      <div class="field">
        <label>ชื่อ-นามสกุลผู้ป่วย</label>
        <input type="text" id="f_name" placeholder="เช่น นางสาว ใจดี มีสุข" value="${editing?editing.name:''}">
      </div>
      <div class="field">
        <label>HN</label>
        <input type="text" id="f_hn" placeholder="เลข HN" value="${editing?editing.hn:''}">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>เลขบัตรประชาชน</label>
        <input type="text" id="f_idcard" placeholder="เลขบัตรประชาชน 13 หลัก" value="${editing?editing.idCard:''}" maxlength="13">
      </div>
      <div class="field">
        <label>สิทธิการรักษา</label>
        <div class="chip-group" id="chipRights">
          ${RIGHTS.map(r=>`<div class="chip ${formSelected.rights===r?'selected':''}" onclick="selectChip('rights','${r}')">${r}</div>`).join('')}
        </div>
        <div id="rightsOtherWrap" style="margin-top:8px; display:${formSelected.rights==='อื่นๆ'?'block':'none'};">
          <input type="text" id="f_rightsOther" placeholder="ระบุสิทธิการรักษา" value="${editing?editing.rightsOther||'':''}">
        </div>
      </div>

function selectChip(field, value){
  if(formSelected[field] === value){
    formSelected[field] = '';
  } else {
    formSelected[field] = value;
  }
  renderForm();
}

function resetForm(){
  formSelected = { disease:'', drug:'', rights:'', bevaType:'' };
  renderForm();
}

async function saveForm(editId){
  const name = document.getElementById('f_name').value.trim();
  const hn = document.getElementById('f_hn').value.trim();
  if(!name || !hn){
    toast('กรุณากรอกชื่อและ HN ให้ครบค่ะ', '⚠️');
    return;
  }
  const customFields = {};
  DB.customFields.forEach(cf=>{
    const el = document.getElementById('cf_'+cf.id);
    if(el) customFields[cf.id] = el.value;
  });

  const record = {
    id: editId || uid(),
    name,
    hn,
    idCard: document.getElementById('f_idcard').value.trim(),
    disease: formSelected.disease,
    diseaseOther: document.getElementById('f_diseaseOther') ? document.getElementById('f_diseaseOther').value.trim() : '',
    rights: formSelected.rights,
    rightsOther: document.getElementById('f_rightsOther') ? document.getElementById('f_rightsOther').value.trim() : '',
    drug: formSelected.drug,
    drugOther: document.getElementById('f_drugOther') ? document.getElementById('f_drugOther').value.trim() : '',
    bevaType: formSelected.bevaType,
    doseCount: document.getElementById('f_doseCount') ? parseInt(document.getElementById('f_doseCount').value)||0 : 0,
    docIssueDate: document.getElementById('f_docIssue').value,
    docExpireDate: document.getElementById('f_docExpire').value,
    notes: document.getElementById('f_notes').value.trim(),
    customFields,
    createdAt: editId ? (DB.patients.find(p=>p.id===editId)||{}).createdAt || new Date().toISOString() : new Date().toISOString(),
  };

  if(editId){
    const idx = DB.patients.findIndex(p=>p.id===editId);
    DB.patients[idx] = record;
  } else {
    DB.patients.push(record);
  }
  await savePatients();
  toast('บันทึกข้อมูลผู้ป่วยเรียบร้อยแล้วค่ะ 🌸');
  resetForm();
  renderNav();
}

function renderPatientTable(){
  const search = (document.getElementById('searchBox')?.value || '').toLowerCase();
  let list = DB.patients.filter(p => p.name.toLowerCase().includes(search) || p.hn.toLowerCase().includes(search));
  const wrap = document.getElementById('patientTableWrap');
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><span class="em">🌷</span>ยังไม่มีข้อมูลผู้ป่วยค่ะ</div>`;
    return;
  }
  wrap.innerHTML = `<table><thead><tr>
    <th>ชื่อ</th><th>HN</th><th>โรค</th><th>ยา</th><th>วันหมดอายุเอกสาร</th><th>สถานะ</th><th></th>
  </tr></thead><tbody>
    ${list.map(p=>{
      const st = expiryStatus(p.docExpireDate);
      return `<tr class="${st.cls}">
        <td>${p.name}</td>
        <td>${p.hn}</td>
        <td>${p.disease==='อื่นๆ'?p.diseaseOther:p.disease}</td>
        <td>${p.drug==='อื่นๆ'?p.drugOther:p.drug}${p.bevaType?' ('+p.bevaType+')':''}</td>
        <td>${fmtDate(p.docExpireDate)}</td>
        <td>${st.badge}</td>
        <td style="white-space:nowrap;">
          <button class="btn small ghost" onclick="renderForm('${p.id}')">แก้ไข</button>
          <button class="btn small secondary" onclick="deletePatient('${p.id}')">ลบ</button>
        </td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

async function deletePatient(id){
  if(!confirm('ยืนยันการลบข้อมูลผู้ป่วยรายนี้หรือไม่คะ?')) return;
  DB.patients = DB.patients.filter(p=>p.id!==id);
  await savePatients();
  toast('ลบข้อมูลแล้วค่ะ', '🗑️');
  renderPatientTable();
  renderNav();
}

/* ============ EXPIRY ALERTS (grouped) ============ */
function renderExpiry(){
  const soon = DB.patients.filter(p=>p.docExpireDate && daysBetween(p.docExpireDate) <= EXPIRY_WARN_DAYS);
  const groups = {};
  soon.forEach(p=>{
    const key = p.docExpireDate;
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const sortedDates = Object.keys(groups).sort((a,b)=> new Date(a)-new Date(b));

  let html = `<div class="card">
    <h2>🔔 แจ้งเตือนเอกสารใกล้หมดอายุ / หมดอายุแล้ว</h2>
    <p class="subnote">แสดงผู้ป่วยที่เอกสารจะหมดอายุภายใน ${EXPIRY_WARN_DAYS} วัน จัดกลุ่มตามวันหมดอายุเดียวกัน เพื่อสะดวกในการเตรียมเอกสารพร้อมกัน</p>
  `;
  if(!sortedDates.length){
    html += `<div class="empty"><span class="em">🎉</span>ยังไม่มีเอกสารใกล้หมดอายุค่ะ</div></div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }
  sortedDates.forEach(date=>{
    const group = groups[date];
    const diff = daysBetween(date);
    const isExpired = diff < 0;
    html += `
    <div style="margin-top:16px; border:1.5px solid ${isExpired?'var(--danger)':'var(--warn)'}; border-radius:16px; padding:14px 16px; background:${isExpired?'#FDF0F0':'#FFF6EF'};">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <strong>${isExpired?'⛔ หมดอายุแล้ว':'⏰ ใกล้หมดอายุ'}: ${fmtDate(date)} ${!isExpired?`(อีก ${diff} วัน)`:''}</strong>
        <span class="badge ${isExpired?'danger':'warn'}">กลุ่มผู้ป่วย ${group.length} ราย</span>
      </div>
      <table style="margin-top:10px;"><thead><tr><th>ชื่อ</th><th>HN</th><th>โรค</th><th>ยา</th></tr></thead><tbody>
        ${group.map(p=>`<tr><td>${p.name}</td><td>${p.hn}</td><td>${p.disease==='อื่นๆ'?p.diseaseOther:p.disease}</td><td>${p.drug==='อื่นๆ'?p.drugOther:p.drug}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

/* ============ CALENDAR ============ */
function renderCalendar(){
  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayStr = new Date().toDateString();

  let cells = [];
  for(let i=startWeekday-1; i>=0; i--){
    cells.push({day: daysInPrevMonth-i, other:true, date:null});
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(calYear, calMonth, d);
    cells.push({day:d, other:false, date: dateObj});
  }
  while(cells.length % 7 !== 0){
    cells.push({day: cells.length - (startWeekday+daysInMonth) + 1, other:true, date:null});
  }

  const dow = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  let html = `
  <div class="card">
    <div class="cal-head">
      <button class="btn ghost small" onclick="changeMonth(-1)">← เดือนก่อน</button>
      <div class="title">📅 ${monthNames[calMonth]} ${calYear+543}</div>
      <button class="btn ghost small" onclick="changeMonth(1)">เดือนถัดไป →</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.other || !c.date) return `<div class="cal-cell other-month"><div class="dnum">${c.day}</div></div>`;
        const dateISO = c.date.toISOString().slice(0,10);
        const isToday = c.date.toDateString() === todayStr;
        const appts = DB.appointments.filter(a=>a.date===dateISO);
        const expiries = DB.patients.filter(p=>p.docExpireDate===dateISO);
        return `<div class="cal-cell ${isToday?'today':''}" onclick="openDayModal('${dateISO}')">
          <div class="dnum">${c.day}</div>
          ${appts.slice(0,2).map(a=>`<div class="evt">🗓️ ${a.patientName}</div>`).join('')}
          ${expiries.slice(0,1).map(e=>`<div class="evt expiry">⏰ ${e.name} หมดอายุ</div>`).join('')}
          ${(appts.length+expiries.length)>3?`<div style="font-size:10px; color:var(--text-soft);">+เพิ่มเติม</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
  document.getElementById('content').innerHTML = html;
}
function changeMonth(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth=11; calYear--; }
  if(calMonth > 11){ calMonth=0; calYear++; }
  renderCalendar();
}

function openDayModal(dateISO){
  const appts = DB.appointments.filter(a=>a.date===dateISO);
  const patientOptions = DB.patients.map(p=>`<option value="${p.id}">${p.name} (HN ${p.hn})</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>📅 นัดหมายวันที่ ${fmtDate(dateISO)}</h3>
      <div id="apptList">
        ${appts.length ? appts.map(a=>`
          <div class="appt-item">
            <span>👤 ${a.patientName} ${a.note?'— '+a.note:''}</span>
            <span class="del" onclick="deleteAppt('${a.id}','${dateISO}')">ลบ</span>
          </div>`).join('') : `<p class="subnote">ยังไม่มีนัดหมายในวันนี้</p>`}
      </div>
      <hr style="border:none; border-top:1px solid var(--line); margin:14px 0;">
      <div class="field">
        <label>เลือกผู้ป่วย</label>
        <select id="apptPatient"><option value="">-- เลือกผู้ป่วย --</option>${patientOptions}</select>
      </div>
      <div class="field">
        <label>รายละเอียดนัด</label>
        <input type="text" id="apptNote" placeholder="เช่น นัดให้ยาครั้งที่ 3">
      </div>
      <div class="close-row">
        <button class="btn secondary" onclick="closeModal()">ปิด</button>
        <button class="btn" onclick="addAppt('${dateISO}')">➕ เพิ่มนัดหมาย</button>
      </div>
    </div>
  </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

async function addAppt(dateISO){
  const patientId = document.getElementById('apptPatient').value;
  const note = document.getElementById('apptNote').value.trim();
  if(!patientId){ toast('กรุณาเลือกผู้ป่วยค่ะ','⚠️'); return; }
  const patient = DB.patients.find(p=>p.id===patientId);
  DB.appointments.push({ id: uid(), patientId, patientName: patient.name, date: dateISO, note });
  await saveAppointments();
  toast('เพิ่มนัดหมายเรียบร้อยค่ะ 🗓️');
  openDayModal(dateISO);
  renderCalendar();
}
async function deleteAppt(apptId, dateISO){
  DB.appointments = DB.appointments.filter(a=>a.id!==apptId);
  await saveAppointments();
  toast('ลบนัดหมายแล้วค่ะ','🗑️');
  openDayModal(dateISO);
  renderCalendar();
}

  DB.customFields = DB.customFields.filter(cf=>cf.id!==id);
  await saveCustomFields();
  toast('ลบช่องข้อมูลแล้วค่ะ','🗑️');
  renderSettings();
}

/* ============ ROUTER ============ */
function renderContent(){
  if(currentTab==='dashboard') renderDashboard();
  else if(currentTab==='form') renderForm();
  else if(currentTab==='bydrug') renderByDrug();
  else if(currentTab==='calendar') renderCalendar();
  else if(currentTab==='expiry') renderExpiry();
  else if(currentTab==='settings') renderSettings();
}

/* ============ CLOCK ============ */
function tickClock(){
  const now = new Date();
  const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const str = `${now.getDate()} ${thaiMonths[now.getMonth()]} ${now.getFullYear()+543} • ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  const el = document.getElementById('clockNow');
  if(el) el.textContent = str;
}

/* ============ INIT ============ */
async function init(){
  document.getElementById('content').innerHTML = `<div class="card"><div class="empty"><span class="em">🌸</span>กำลังโหลดข้อมูล...</div></div>`;
  await loadDB();
  renderNav();
  renderContent();
  tickClock();
  setInterval(tickClock, 30000);
}
init();
</script>
